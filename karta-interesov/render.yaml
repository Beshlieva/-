# Описание сервиса на Render (frontend). Данные хранятся в Supabase, отдельный backend не нужен.
# Прежние сервисы karta-api (PHP) и karta-db (MySQL) больше не используются.
#
# Переменные VITE_SUPABASE_URL и VITE_SUPABASE_ANON_KEY задаются в панели Render
# (Environment) и подставляются в код ВО ВРЕМЯ СБОРКИ — после их изменения нужен новый деплой.
# Секретный ключ Supabase здесь не нужен и указывать его нельзя.
services:
  - type: web
    name: karta-interesov
    runtime: node
    rootDir: karta-interesov
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx vite preview --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_APP_MODE
        value: supabase
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
